name: Build Android APK

# Capacitor diye Android debug APK banay ar artifact hisebe upload kore.
# Download: repo -> Actions -> "Build Android APK" -> Artifacts -> bd-bus-sim-apk
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Capacitor 6 + AGP 8 er jonno Java 17 lagbe.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci

      # android/ gitignore kora, tai prottek bar notun kore toiri hoy.
      - name: Add Android platform
        run: |
          if [ -d android ]; then
            echo "android/ already ache, skip."
          else
            npx cap add android
          fi

      - name: Sync www/ into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bd-bus-sim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
